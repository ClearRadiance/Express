<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>Express Server</title>
</head>

<body class="{{THEME_CLASS}}">
    <main>
        <h1 id="main-title">Express page for my node server.js</h1>

        <nav id="main-nav">
            <a href="/" class="home-link">Home</a>
            <a href="/landing" class="landing-link">Landing</a>
            <a href="/guestbook" class="guestbook-link">Guestbook</a>
            <a href="/dashboard" class="dashboard-link">Dashboard</a>
        </nav>

        <div id="status"></div>
        <div id="login-section" class="login-section" hidden>
            <h2 id="login-title">Login</h2>
            <form id="login-form">
                <input id="password" type="password" name="password" placeholder="Password" required />
                <label>
                    <input type="checkbox" name="rememberMe">
                    Remember me
                </label>
                <button type="submit">Login</button>
            </form>
            <p id="login-message"></p>
        </div>
        <button id="logout-button" hidden>Logout</button>
    </main>
    <script>
        const loginForm = document.querySelector('#login-form');
        const loginMessage = document.querySelector('#login-message');
        const status = document.querySelector('#status');
        const loginSection = document.querySelector('#login-section');
        const logoutButton = document.querySelector('#logout-button');

        async function checkAuthState() {
            try {
                const response = await fetch('/api/whoami');
                const data = await response.json();

                if (data.loggedIn) {
                    status.innerHTML =
                        '<h1>Welcome back!</h1><a href="/dashboard" class="dashboard-button">Dashboard</a>';

                    loginSection.hidden = true;
                    logoutButton.hidden = false;

                } else {
                    status.innerHTML = '<h1>Welcome! <br> reminder: do guestbook upgrades</h1>';

                    loginSection.hidden = false;
                    logoutButton.hidden = true;
                }

            } catch (error) {
                console.error('Auth check failed:', error);

                status.innerHTML = '<h1>Welcome!</h1>';
                loginSection.hidden = false;
                logoutButton.hidden = true;
            }
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const password = document.querySelector('#password').value;
            const rememberMe = event.target.rememberMe.checked;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        password,
                        rememberMe
                    })
                });

                const data = await response
                    .json()
                    .catch(() => ({ success: false }));

                if (data.success) {
                    loginMessage.textContent = 'Login successful!';

                    loginForm.reset();

                    await checkAuthState();

                    window.location.href = data.redirect || '/';

                } else {
                    loginMessage.textContent =
                        data.error || 'Login failed. Please check your password.';
                }

            } catch (error) {
                console.error('Login error:', error);

                loginMessage.textContent =
                    'Something went wrong while logging in.';
            }
        });

        logoutButton.addEventListener('click', async () => {
            try {
                const response = await fetch('/logout', {
                    method: 'POST'
                });

                const data = await response
                    .json()
                    .catch(() => ({ success: false }));

                if (data.success) {
                    window.location.href = '/';
                }

            } catch (error) {
                console.error('Logout error:', error);
            }
        });

        checkAuthState();
    </script>

</body>

</html>
